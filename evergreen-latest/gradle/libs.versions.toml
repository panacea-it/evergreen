[versions]
agp = "8.8.0"
cameraCore = "1.0.0-beta02"
compiler = "4.14.2"
androidLifecycleExtensions = "1.1.1"
glide = "4.16.0"
gson = "2.10.1"
kotlin = "1.9.21"
